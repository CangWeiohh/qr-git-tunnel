</script>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --blue: #2563eb;
    --blue-d: #1d4ed8;
    --green: #059669;
    --danger: #dc2626;
    --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 16px 64px;
  }
  body.has-qr .wrap { max-width: 960px; }
  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    letter-spacing: -0.03em;
  }
  .sub {
    margin: 0 0 22px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  label.field {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  textarea {
    width: 100%;
    min-height: 180px;
    resize: vertical;
    border: 2px dashed var(--line);
    border-radius: 18px;
    background: #f8fafc;
    padding: 16px;
    font-size: 14px;
    line-height: 1.55;
    outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  textarea:focus { border-color: var(--blue); background: #fff; }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-top: 14px;
  }
  .row.between { justify-content: space-between; }
  .stat {
    font-size: 13px;
    color: var(--muted);
  }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .ctrl {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 14px;
  }
  .ctrl-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .ctrl-item span {
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    min-width: 120px;
  }
  .ctrl-item span em {
    color: var(--blue);
    font-style: normal;
    font-family: ui-monospace, monospace;
  }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    height: 28px;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; background: var(--line); border-radius: 999px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--blue); margin-top: -7px;
    border: 2px solid #fff; box-shadow: 0 2px 8px rgba(37,99,235,.35);
  }
  select, button {
    font: inherit;
  }
  select {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 12px;
    padding: 8px 12px;
    color: var(--text);
  }
  .btns {
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    border: 0;
    border-radius: 16px;
    padding: 14px 12px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .08s ease, background .15s ease;
  }
  button:active { transform: scale(0.97); }
  .btn-muted { background: #eef2f7; color: #334155; }
  .btn-primary { background: var(--blue); color: #fff; box-shadow: 0 8px 20px rgba(37,99,235,.28); }
  .btn-primary:hover { background: var(--blue-d); }
  .btn-danger { background: #fee2e2; color: var(--danger); }
  .hint {
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }
  .hint code {
    background: #eef2ff;
    color: #3730a3;
    padding: 1px 6px;
    border-radius: 6px;
    font-size: 11px;
  }
  #player {
    display: none;
  }
  #player.show { display: flex; gap: 20px; align-items: stretch; }
  .qr-box { flex: 1 1 auto; min-width: 0; }
  @media (max-width: 640px) {
    #player.show { flex-direction: column; align-items: stretch; }
    .qr-sidebar { width: 100%; align-self: stretch; }
  }
  .qr-sidebar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 180px;
    flex-shrink: 0;
    align-self: center;
  }
  .page-num {
    text-align: center;
    font-family: ui-monospace, monospace;
    font-weight: 900;
    font-size: 40px;
    letter-spacing: -0.04em;
    margin-bottom: 8px;
  }
  .page-num .cur { color: var(--blue); }
  .page-num .sep { color: #cbd5e1; }
  .mode-tag {
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .mode-tag.ok { color: var(--green); }
  .mode-tag.warn { color: #d97706; }
  .qr-box {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    background: transparent;
    padding: 0;
  }
  #qr-canvas {
    /* --qr-css is the native bitmap size (per render); displayed 1:1 so the
       screenshot captures crisp integer-pixel modules (scaling garbles Bob) */
    width: min(72vw, 560px, var(--qr-css, 560px));
    max-width: 100%;
    height: auto;
    image-rendering: pixelated;
    background: #fff;
  }
  .qr-sidebar .page-num {
    font-size: 28px;
  }
  .play-ctrls-vertical {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .play-ctrls-vertical button {
    width: 100%;
    padding: 10px 8px;
    border-radius: 14px;
    background: #eef2f7;
    color: #0f172a;
    font-size: 13px;
    font-weight: 700;
    border: 0;
    cursor: pointer;
  }
  .actions-vertical {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .actions-vertical button {
    width: 100%;
    padding: 8px;
    border-radius: 12px;
    background: #eef2f7;
    color: #334155;
    font-size: 12px;
    font-weight: 700;
    border: 0;
    cursor: pointer;
  }
  .err {
    display: none;
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fef2f2;
    color: var(--danger);
    font-size: 13px;
    font-weight: 700;
  }
  .err.show { display: block; }

  /* fullscreen presenter: big QR, black bg, easy Mac screenshot */
  body.fs {
    background: #000;
  }
  body.fs .wrap { max-width: none; padding: 0; }
  body.fs .card.hide-fs,
  body.fs h1,
  body.fs .sub { display: none !important; }
  body.fs #player {
    display: flex !important;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    background: #000;
    color: #fff;
    padding: 16px;
    gap: 24px;
  }
  body.fs .qr-sidebar {
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    width: 200px;
    flex-shrink: 0;
  }
  body.fs .qr-sidebar .page-num { color: #fff; font-size: 36px; }
  body.fs .qr-sidebar .page-num .sep { color: #475569; }
  body.fs .qr-sidebar .mode-tag { color: #94a3b8; }
  body.fs .qr-sidebar .play-ctrls-vertical button,
  body.fs .qr-sidebar .actions-vertical button {
    background: #1e293b;
    color: #e2e8f0;
  }
  body.fs .qr-box {
    /* quiet zone is baked into the canvas bitmap, no white panel needed */
    background: transparent;
    border: 0;
    padding: 0;
  }
  body.fs #qr-canvas {
    /* 1:1 with the bitmap (no upscale) - var caps it at the native size so the
       screenshot sees crisp integer-pixel modules */
    width: min(96vw, 96vh, var(--qr-css-fs, 460px));
    max-width: none;
  }

  /* When QR is showing, hide input card and make player fill the view */
  .hide-when-qr { display: none !important; }
  body.fs .hide-when-qr { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="hide-when-qr">文本出码</h1>
  <p class="sub hide-when-qr">把云桌面里的文本变成二维码，Mac 截图即可识别复制。<br>
  短文本一码出；超长自动分页。整页离线可用，可直接粘进云桌面双击打开。</p>

  <div class="card hide-fs" id="inputCard">
    <label class="field" for="inputText">文本内容</label>
    <textarea id="inputText" placeholder="粘贴要带出云桌面的文本…&#10;例如：报错日志、配置片段、token、SQL、短代码"></textarea>

    <div class="row between">
      <div class="stat">
        字符 <b id="charCount">0</b>
        · UTF-8 <b id="byteCount">0</b> B
        · 预计 <b id="pageEst">0</b> 页
      </div>
      <button class="btn-danger" type="button" id="btnClear" style="padding:8px 14px;border-radius:12px;font-size:12px;">清空</button>
    </div>

    <div class="ctrl">
      <div class="ctrl-item">
        <span>单页容量 <em id="capVal">1200</em> B</span>
        <input id="capRange" type="range" min="400" max="2000" step="50" value="1200">
      </div>
      <div class="ctrl-item">
        <span>二维码尺寸 <em id="sizeVal">300</em> px</span>
        <input id="sizeRange" type="range" min="220" max="680" step="20" value="300">
      </div>
      <div class="ctrl-item">
        <span>纠错等级</span>
        <select id="eccLevel">
          <option value="L" selected>L · 最大容量（推荐）</option>
          <option value="M">M · 平衡</option>
          <option value="Q">Q · 更耐污损</option>
          <option value="H">H · 最强纠错</option>
        </select>
      </div>
    </div>

    <div class="btns">
      <button type="button" class="btn-primary" id="btnGen">生成二维码</button>
    </div>
    <div class="err" id="errBox"></div>
    <p class="hint">
      · 单页：二维码内容就是原文，Mac 截图/实况文本可直接得到完整内容。<br>
      · 多页：默认每页内容为 <code>[2/5]</code> + 文本切片，←/→ 手动翻页，按页截图后按序号拼回。<br>
      · 容量宁小勿大：云桌面缩放/压缩后，过大 QR 更难识别。识别不稳就降低「单页容量」。
    </p>
  </div>

  <div class="card" id="player">
    <div class="qr-box">
      <canvas id="qr-canvas"></canvas>
    </div>
    <div class="qr-sidebar">
      <div class="page-num">
        <span class="cur" id="curPage">0</span><span class="sep">/</span><span id="totalPage">0</span>
      </div>
      <div class="mode-tag" id="modeTag">未生成</div>
      <input id="pageSlider" type="range" min="0" max="0" value="0" style="width:100%;margin:8px 0;">
      <div class="play-ctrls-vertical">
        <button type="button" id="btnPrev" title="上一页">◀ 上一页</button>
        <button type="button" id="btnNext" title="下一页">下一页 ▶</button>
      </div>
      <div class="actions-vertical">
        <button type="button" class="btn-muted" id="btnFs2">全屏</button>
        <button type="button" class="btn-muted" id="btnCopyPage">复制文本</button>
        <button type="button" class="btn-muted" id="btnBack">← 返回</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const inputText = $('inputText');
  const charCount = $('charCount');
  const byteCount = $('byteCount');
  const pageEst = $('pageEst');
  const capRange = $('capRange');
  const capVal = $('capVal');
  const sizeRange = $('sizeRange');
  const sizeVal = $('sizeVal');
  const eccLevel = $('eccLevel');
  const errBox = $('errBox');
  const inputCard = $('inputCard');
  const player = $('player');
  const curPage = $('curPage');
  const totalPage = $('totalPage');
  const modeTag = $('modeTag');
  const pageSlider = $('pageSlider');
  const btnGen = $('btnGen');
  const btnFs2 = $('btnFs2');
  const btnPrev = $('btnPrev');
  const btnNext = $('btnNext');
  const btnClear = $('btnClear');
  const btnCopyPage = $('btnCopyPage');
  const btnBack = $('btnBack');

  const state = {
    pages: [],       // payload strings put into QR
    rawParts: [],    // text parts without considering failure
    idx: 0,
    qr: null,
  };

  function utf8Bytes(str) {
    return new TextEncoder().encode(str);
  }

  function qrValue(str) {
    // QRious stores each char's low byte as a data byte and runs ECC over the
    // raw char codes, so any char with code > 255 (all non-ASCII text) corrupts
    // the ECC and yields an undecodable QR. Convert to a UTF-8 binary string
    // (one char per byte, all <= 255) so the QR carries proper UTF-8 and is
    // version-sized by the real byte count.
    const u8 = new TextEncoder().encode(str);
    let bin = '';
    for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
    return bin;
  }

  function showErr(msg) {
    if (!msg) {
      errBox.classList.remove('show');
      errBox.textContent = '';
      return;
    }
    errBox.textContent = msg;
    errBox.classList.add('show');
  }

  function estimatePages(text, cap) {
    if (!text) return 0;
    const n = utf8Bytes(text).length;
    // reserve some bytes for [i/n]\\n header in multi-page mode
    const reserve = 16;
    const body = Math.max(200, cap - reserve);
    return Math.max(1, Math.ceil(n / body));
  }

  function updateStats() {
    const text = inputText.value;
    const bytes = utf8Bytes(text).length;
    charCount.textContent = String(text.length);
    byteCount.textContent = String(bytes);
    const cap = parseInt(capRange.value, 10);
    pageEst.textContent = String(estimatePages(text, cap));
    capVal.textContent = String(cap);
  }

  /**
   * Split UTF-8 text on byte boundaries without breaking code points.
   * maxBytes is for the final QR payload (including optional header).
   */
  function splitTextByUtf8(text, maxBodyBytes) {
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const all = enc.encode(text);
    const parts = [];
    let i = 0;
    while (i < all.length) {
      let end = Math.min(i + maxBodyBytes, all.length);
      // do not cut inside a UTF-8 sequence
      if (end < all.length) {
        while (end > i && (all[end] & 0xc0) === 0x80) end--;
        if (end === i) {
          // fallback: force one code point
          end = Math.min(i + 4, all.length);
          while (end < all.length && (all[end] & 0xc0) === 0x80) end++;
        }
      }
      parts.push(dec.decode(all.subarray(i, end)));
      i = end;
    }
    return parts.length ? parts : [''];
  }

  function buildPages(text) {
    const cap = parseInt(capRange.value, 10);
    const bytes = utf8Bytes(text).length;

    // Try single-page first: raw text only (best for Mac Live Text)
    if (bytes <= cap) {
      try {
        // probe encode
        probeEncode(text);
        return { pages: [text], mode: 'single' };
      } catch (e) {
        // fall through to multipage with smaller body
      }
    }

    // multi-page: no header, just split the text
    let bodyCap = Math.max(200, cap);
    let parts = splitTextByUtf8(text, bodyCap);

    // If still too big for encoder (rare: high ECC), shrink and retry
    for (let attempt = 0; attempt < 8; attempt++) {
      const total = parts.length;
      const pages = parts; // No header prefix, just raw parts
      try {
        // probe first, mid, last
        probeEncode(pages[0]);
        if (pages.length > 1) probeEncode(pages[pages.length - 1]);
        if (pages.length > 2) probeEncode(pages[Math.floor(pages.length / 2)]);
        return { pages, mode: total === 1 ? 'single' : 'multi' };
      } catch (e) {
        bodyCap = Math.max(120, Math.floor(bodyCap * 0.75));
        parts = splitTextByUtf8(text, bodyCap);
      }
    }
    throw new Error('文本过长或包含难编码内容，请降低单页容量/纠错等级后再试');
  }

  function probeEncode(value) {
    // Use an offscreen probe so failures don't blank the visible canvas mid-way.
    // padding 0 pins the QR to the top-left so render() can scan row 0 for the
    // module count.
    if (!state._probe) {
      const c = document.createElement('canvas');
      state._probe = new QRious({ element: c, size: 200, level: eccLevel.value || 'L', padding: 0 });
    }
    state._probe.level = eccLevel.value || 'L';
    state._probe.value = qrValue(value);
  }

  function moduleCountOf(payload) {
    // Probe-render onto the tiny offscreen canvas (reused by buildPages) and
    // read back row 0: the top finder patterns span the full QR width, so the
    // rightmost dark pixel marks the QR's right edge, and the first dark run
    // is the 7-module top-left finder, giving the per-module pixel size.
    probeEncode(payload);
    const cv = state._probe.canvas;
    const row = cv.getContext('2d').getImageData(0, 0, cv.width, 1).data;
    let side = 0;
    for (let x = 0; x < cv.width; x++) if (row[x * 4] < 128) side = x + 1;
    if (side <= 0) return 0;
    let run = 0;
    while (run < side && row[run * 4] < 128) run++;
    const ms = Math.max(1, Math.round(run / 7));
    return Math.max(21, Math.round(side / ms));
  }

  function ensureQr() {
    // The visible QR is drawn natively at the chosen module size (QRious with
    // padding = a 4-module quiet zone), so the canvas bitmap IS the display
    // resolution. No CSS scaling means no nearest-neighbour downscale aliasing,
    // which previously made sparse (low-data) QRs unscannable.
    if (!state.qr) {
      state.qr = new QRious({
        element: $('qr-canvas'),
        level: eccLevel.value || 'L',
        background: '#ffffff',
        foreground: '#000000',
      });
    }
    return state.qr;
  }

  function render() {
    if (!state.pages.length) return;
    const i = state.idx;
    const payload = state.pages[i];
    curPage.textContent = String(i + 1);
    totalPage.textContent = String(state.pages.length);
    pageSlider.max = String(Math.max(0, state.pages.length - 1));
    pageSlider.value = String(i);
    try {
      const modules = moduleCountOf(payload);
      if (modules <= 0) throw new Error('无法确定二维码尺寸');
      // QR display size is user-tunable: small-capacity codes scan best small
      // and displayed 1:1 (no CSS scaling), so screenshot decoders see crisp
      // integer-pixel modules. Dense codes hit the mSize floor and grow naturally
      // with module count. Default 300px keeps short text compact.
      const target = parseInt(sizeRange.value, 10) || 300;
      let mSize = Math.floor(target / (modules + 8));
      mSize = Math.max(3, Math.min(24, mSize));
      const quiet = mSize * 4;        // 4-module quiet zone (spec minimum)
      const total = modules * mSize + quiet * 2;
      const qr = ensureQr();
      qr.set({ size: total, padding: quiet, level: eccLevel.value || 'L', value: qrValue(payload) });
      const dst = $('qr-canvas');
      // Display at the bitmap's natural size (1:1); the viewport caps only ever
      // shrink it on very small screens, never upscale.
      dst.style.setProperty('--qr-css', total + 'px');
      dst.style.setProperty('--qr-css-fs', total + 'px');
      showErr('');
    } catch (e) {
      showErr('第 ' + (i + 1) + ' 页编码失败：' + (e && e.message ? e.message : e));
    }
  }

  function generate() {
    showErr('');
    const text = inputText.value;
    if (!text) {
      showErr('请先粘贴要带出的文本');
      return;
    }
    try {
      const result = buildPages(text);
      state.pages = result.pages;
      state.idx = 0;
      player.classList.add('show');
      inputCard.classList.add('hide-when-qr');  // Hide input area, QR takes full view
      document.body.classList.add('has-qr');
      if (result.mode === 'single') {
        modeTag.textContent = '单页模式 · 扫码/截图即得完整原文';
        modeTag.className = 'mode-tag ok';
      } else {
        modeTag.textContent = '多页模式 · 共 ' + state.pages.length + ' 页，手动翻页；按序号截图后拼回';
        modeTag.className = 'mode-tag warn';
      }
      render();
      player.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      showErr(String(e && e.message ? e.message : e));
      player.classList.remove('show');
      inputCard.classList.remove('hide-when-qr');
      document.body.classList.remove('has-qr');
      state.pages = [];
    }
  }

  function toggleFs() {
    document.body.classList.toggle('fs');
    // re-render so canvas crisp after layout change
    setTimeout(render, 50);
  }

  function step(d) {
    if (!state.pages.length) return;
    state.idx = (state.idx + d + state.pages.length) % state.pages.length;
    render();
  }

  // events
  inputText.addEventListener('input', updateStats);
  capRange.addEventListener('input', function () {
    updateStats();
    if (state.pages.length) generate();
  });
  sizeRange.addEventListener('input', function () {
    sizeVal.textContent = sizeRange.value;
    if (state.pages.length) render();
  });
  eccLevel.addEventListener('change', function () {
    if (state.pages.length) generate();
  });
  btnGen.addEventListener('click', generate);
  btnFs2.addEventListener('click', toggleFs);
  btnPrev.addEventListener('click', function () { step(-1); });
  btnNext.addEventListener('click', function () { step(1); });
  pageSlider.addEventListener('input', function () {
    if (!state.pages.length) return;
    state.idx = parseInt(pageSlider.value, 10) || 0;
    render();
  });
  btnClear.addEventListener('click', function () {
    inputText.value = '';
    updateStats();
    state.pages = [];
    player.classList.remove('show');
    inputCard.classList.remove('hide-when-qr');
    document.body.classList.remove('has-qr');
    document.body.classList.remove('fs');
    showErr('');
  });
  btnBack.addEventListener('click', function () {
    state.pages = [];
    player.classList.remove('show');
    inputCard.classList.remove('hide-when-qr');
    document.body.classList.remove('has-qr');
    document.body.classList.remove('fs');
  });
  btnCopyPage.addEventListener('click', async function () {
    if (!state.pages.length) return;
    const t = state.pages[state.idx];
    try {
      await navigator.clipboard.writeText(t);
      const old = btnCopyPage.textContent;
      btnCopyPage.textContent = '已复制';
      setTimeout(function () { btnCopyPage.textContent = old; }, 1000);
    } catch (e) {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = t;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('fs')) {
      document.body.classList.remove('fs');
      setTimeout(render, 50);
      return;
    }
    if (!state.pages.length) return;
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
    if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && document.activeElement !== inputText) {
      toggleFs();
    }
  });

  updateStats();
})();
</script>
</body>
</html>
